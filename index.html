<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeKeCy-站点地图</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #172033;
      --muted: #6b7280;
      --line: #e5e7eb;
      --card: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      color: #172033;
      background: #e5e7eb;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(59, 130, 246, 0.16), transparent 28%),
        radial-gradient(circle at 88% 85%, rgba(14, 165, 233, 0.12), transparent 32%),
        linear-gradient(135deg, #f8fbff 0%, #eef4ff 48%, #f8fafc 100%);
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: 34px 38px 38px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(37, 99, 235, 0.12);
      backdrop-filter: blur(16px);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    h1::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 30px;
      margin-right: 12px;
      vertical-align: -4px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3b82f6, #06b6d4);
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.38);
    }

    .welcome {
      margin: 18px 0 30px;
      font-size: 17px;
      line-height: 1.7;
      color: #4b5563;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 14px;
    }

    td {
      position: relative;
      overflow: hidden;
      padding: 20px 24px 20px 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    td::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5px;
      background: linear-gradient(180deg, #3b82f6, #22d3ee);
      opacity: 0.9;
    }

    tr:hover td {
      transform: translateY(-2px);
      border-color: rgba(37, 99, 235, 0.28);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.12);
    }


    a,
    a:visited,
    a:hover,
    a:active,
    a:focus {
      background: transparent;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    a.site-link {
      display: block;
      color: var(--primary);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      text-decoration: none;
    }

    a.site-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    a.site-link::after {
      content: "↗";
      display: inline-block;
      margin-left: 8px;
      font-size: 15px;
      font-weight: 500;
      transition: transform 0.2s ease;
    }

    tr:hover a.site-link::after {
      transform: translate(2px, -2px);
    }

    .note {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }


    footer {
      margin-top: 18px;
      padding-top: 22px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    .footer-copy .ver {
      margin-left: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 620px) {
      body {
        padding: 18px;
      }

      .page {
        padding: 26px 20px;
        border-radius: 20px;
      }

      td {
        padding: 18px 18px 18px 22px;
      }

  
    a,
    a:visited,
    a:hover,
    a:active,
    a:focus {
      background: transparent;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    a.site-link {
        font-size: 17px;
      }

      .note {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>GeKeCy-站点地图</h1>
    <p class="welcome">欢迎来到GeKeCy的站点地图！要来点什么呢？</p>

    <table aria-label="GeKeCy 站点导航">
      <tr>
        <td>
          <a class="site-link" href="https://gekecy.github.io/homepage" target="_blank">GeKeCy浏览器主页</a>
          <span class="note">GeKeCy主页,一个极简主义,可自定义,多搜索引擎,极速,纯净的浏览器主页
极速启动,多引擎切换,懂你的网站导航。GeKeCy主页,给你最畅快的上网体验。</span>
        </td>
      </tr>
      <tr>
        <td>
          <a class="site-link" href="https://gekecy.github.io/source-viewer" target="_blank">GeKeCy-网页查源</a>
          <span class="note">GeKeCy-网页查源,一个查看/下载源代码的工具网站
要查找某个网站的源代码吗？来这,这可能是你最好的归宿</span>
        </td>
      </tr>
      <tr>
        <td>
          <a class="site-link" href="https://gekecy.github.io/random-selector" target="_blank">GeKeCy-随机抽取</a>
          <span class="note">GeKeCy-随机抽取,一个概率随机的数字/字母抽取器
你曾因为选择困难而迟疑？你们的救星来啦！</span>
        </td>
      </tr>
    </table>
  </main>

  <footer>
    <div class="footer-copy">GeKeCy-Sitemap © 2026<span class="ver">v0.1.3</span></div>
  </footer>
</body>
</html>
